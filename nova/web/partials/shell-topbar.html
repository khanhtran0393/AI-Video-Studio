  <!-- ============ THANH TRẠNG THÁI DƯỚI ============ -->
  <footer class="statusbar" id="statusBar">
    <div class="st"><span style="color:var(--accent)">⚡</span> Model: <b id="sbModel">—</b></div>
    <div class="st"><span class="gdot" id="sbApiDot"></span> API <b id="sbApiState">—</b></div>
    <div class="sb-spacer"></div>
  </footer>

  <!-- ============ CONTENT (topbar + main) ============ -->
  <div class="content-col">
  <header class="topbar">
    <div class="tb-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input id="navSearch" type="text" placeholder="Tìm công cụ…  (⌘K)" oninput="navFilter(this.value)" onkeydown="if(event.key==='Escape'){this.value='';navFilter('')}">
    </div>
    <div class="tb-ws">
      <select id="profileSelect" onchange="switchProfile(this.value)" title="Chọn Profile (kênh)"></select>
      <select id="chLang" onchange="setChannelLang(this.value)" title="Ngôn ngữ kênh — áp cho kịch bản, giọng đọc, SEO, phân tích… của kênh này" style="max-width:150px">
        <option value="Tiếng Việt">🌐 Tiếng Việt</option>
        <option value="English">🌐 English</option>
        <option value="한국어 (Korean)">🌐 한국어</option>
        <option value="日本語 (Japanese)">🌐 日本語</option>
        <option value="中文 (Chinese)">🌐 中文</option>
        <option value="Español (Spanish)">🌐 Español</option>
        <option value="Deutsch (German)">🌐 Deutsch</option>
        <option value="Français (French)">🌐 Français</option>
        <option value="Português (Portuguese)">🌐 Português</option>
        <option value="Русский (Russian)">🌐 Русский</option>
        <option value="हिन्दी (Hindi)">🌐 हिन्दी</option>
        <option value="العربية (Arabic)">🌐 العربية</option>
      </select>
      <span class="tb-ws-sep"></span>
      <select id="videoSelect" onchange="switchVideo(this.value)" title="Chọn Video trong Profile"></select>
      <button onclick="openVideoManager()" title="Quản lý / xoá video" style="display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:1px solid var(--border);background:var(--surface);border-radius:8px;cursor:pointer;color:var(--text-muted);flex:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/></svg>
      </button>
      <button class="tb-newvid" onclick="newVideo()" title="Tạo Video mới (giữ style + nhân vật của kênh)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>Video
      </button>
    </div>
    <div class="tb-spacer"></div>
    <a id="tbMacUpdate" title="Có bản mới cho Mac — bấm để tải từ web" onclick="macDownloadUpdate();return false;"
       style="display:none;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;cursor:pointer;
              font-size:12.5px;font-weight:700;color:var(--on-accent);text-decoration:none;
              background:linear-gradient(180deg,var(--accent-2),var(--accent));box-shadow:0 3px 12px -4px var(--accent)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="width:14px;height:14px"><path d="M12 3v12m0 0l4-4m-4 4l-4-4M5 21h14"/></svg>
      <span id="tbMacUpdTxt">Có bản mới — Tải cho Mac</span>
    </a>
    <div id="tierChipTop" class="tb-tier" style="display:none" title="Gói đang dùng" onclick="showUpgradeModal()"></div>
    <button id="upgradeBtnTop" class="tb-upgrade" onclick="showUpgradeModal()" title="Xem bảng giá & nâng cấp" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="width:15px;height:15px"><path d="M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5z"/></svg>Nâng cấp
    </button>
    <button class="theme-toggle" onclick="toggleTheme()" title="Đổi giao diện sáng/tối" id="themeToggle">🌙</button>
    <div class="tb-user-wrap">
      <div class="tb-user" id="tbUserChip" style="display:none" onclick="toggleUserMenu(event)" title="Tài khoản">
        <span class="tb-av" id="tbAvatar">?</span>
        <div class="tb-meta"><div class="tb-name" id="tbName">—</div><div class="tb-role" id="tbRole">Admin</div></div>
        <span class="tb-updot" id="tbUpdateDot" title="Có bản cập nhật mới"></span>
        <svg class="tb-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div class="tb-menu" id="tbUserMenu">
        <div class="tb-upd" id="tbUpdateBanner" onclick="doAppUpdate()">
          <span class="tb-upd-ic">⬆</span>
          <div class="tb-upd-tx"><b id="tbUpdateTitle">Có bản cập nhật mới</b><span id="tbUpdateSub">Nhấn để cập nhật</span></div>
        </div>
        <div id="tbUserSlot"></div>
        <div class="tb-ver" id="tbVersion">Phiên bản —</div>
      </div>
    </div>
  </header>
