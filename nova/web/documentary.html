<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Nova Documentary Engine</title>
<style>
  :root { --bg:#0d0c0b; --panel:#171412; --panel2:#1f1b18; --line:#332c26; --text:#efe8df; --dim:#a89c8d; --accent:#e07a46; --ok:#6fbf73; --warn:#e0b046; --err:#e06a5a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font:14px/1.5 system-ui, sans-serif; padding:16px; }
  header { display:flex; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  header h1 { font-size:18px; letter-spacing:.5px; }
  header .spacer { flex:1; }
  .grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; min-height:120px; }
  .panel h2 { font-size:13px; text-transform:uppercase; letter-spacing:1px; color:var(--accent); margin-bottom:8px; display:flex; justify-content:space-between; }
  .panel h2 .num { color:var(--dim); }
  .wide { grid-column:span 2; } .full { grid-column:span 3; }
  textarea, input, select, button { font:inherit; }
  textarea, input, select { width:100%; background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:8px; }
  textarea { min-height:90px; resize:vertical; }
  button { background:var(--accent); color:#1b1108; border:none; border-radius:6px; padding:8px 14px; font-weight:700; cursor:pointer; }
  button.secondary { background:var(--panel2); color:var(--text); border:1px solid var(--line); }
  button:disabled { opacity:.45; cursor:default; }
  .row { display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .row > * { flex:1; min-width:120px; }
  .meta { color:var(--dim); font-size:12px; }
  .tag { display:inline-block; background:var(--panel2); border:1px solid var(--line); border-radius:20px; padding:1px 10px; font-size:11px; margin:2px; color:var(--dim); }
  .beat { border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:6px; padding:8px; margin-bottom:8px; background:var(--panel2); }
  .beat .bt { display:flex; justify-content:space-between; font-size:12px; color:var(--dim); }
  .beat .bt b { color:var(--text); }
  .status-pass { color:var(--ok); } .status-pass-with-warnings { color:var(--warn); } .status-fail { color:var(--err); }
  #progressBar { height:8px; background:var(--panel2); border-radius:4px; overflow:hidden; flex:1; min-width:200px; }
  #progressFill { height:100%; width:0; background:var(--accent); transition:width .3s; }
  ul { list-style:none; } ul li { padding:3px 0; border-bottom:1px dashed var(--line); font-size:13px; }
  .err { color:var(--err); } .warn { color:var(--warn); }
  #notice { display:none; background:#3a2c14; border:1px solid var(--warn); border-radius:8px; padding:12px; margin-bottom:12px; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th, td { text-align:left; padding:4px 6px; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:600; }
  .bar { display:inline-block; height:8px; background:var(--accent); border-radius:2px; vertical-align:middle; }
</style>
</head>
<body>
<div id="notice"></div>
<header>
  <h1>🎬 Nova Documentary Engine</h1>
  <div id="progressBar"><div id="progressFill"></div></div>
  <span id="progressLabel" class="meta">idle</span>
  <span class="spacer"></span>
  <button id="btnNew">Dự án mới</button>
  <button id="btnRunFull" class="run">Chạy pipeline AI</button>
</header>
<div class="grid" id="panels"></div>
<script src="documentary-panel.js"></script>
</body>
</html>
