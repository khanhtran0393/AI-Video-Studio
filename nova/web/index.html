<!-- Kho cài đặt BỀN cho API key — phải chạy TRƯỚC mọi script khác.
     Trang được phục vụ ở http://localhost:<port>, mà localStorage gắn chặt vào origin:
     port đổi (47280 bận → 47281/…/ngẫu nhiên) hoặc Chromium dọn kho là toàn bộ key bay sạch
     → "nhập key, thoát ra vào lại là mất". Ở đây đồng bộ hai chiều với file nova-settings.json
     trong userData (không dính origin) rồi soi localStorage.setItem để mọi lần lưu sau đều ghi kèm ra file. -->
<script>
(function () {
  var W = window.novaStore;
  if (!W || !W.seed || !window.localStorage) return;   // chạy trên web thường: giữ nguyên hành vi cũ
  // Chỉ giữ nhóm CẤU HÌNH/API. Dữ liệu nặng (hàng đợi, lịch sử, project…) vẫn nằm yên ở localStorage.
  var PREFIX = ['api_', 'json_fb_', 't8_'];
  var EXACT = { 'yt_api_key': 1, 'pexels-key': 1, 'pixabay-key': 1, 'unsplash-key': 1 };
  function persisted(k) {
    if (EXACT[k]) return true;
    for (var i = 0; i < PREFIX.length; i++) if (k.indexOf(PREFIX[i]) === 0) return true;
    return false;
  }
  var ls = window.localStorage, proto = Storage.prototype;
  var _set = proto.setItem, _del = proto.removeItem;

  // 1) File → localStorage. File là bản GỐC: localStorage có thể vừa bị xoá trắng hoặc là origin mới toanh.
  var seed = W.seed, seeded = {};
  for (var k in seed) {
    if (!Object.prototype.hasOwnProperty.call(seed, k)) continue;
    try { _set.call(ls, k, seed[k]); seeded[k] = 1; } catch (e) { /* đầy kho cũng kệ, file mới là chỗ dựa */ }
  }

  // 2) localStorage → file: chuyển nhà một lần cho key user đã nhập từ trước bản vá này.
  try {
    for (var i = 0; i < ls.length; i++) {
      var key = ls.key(i);
      if (key && !seeded[key] && persisted(key)) W.set(key, ls.getItem(key));
    }
  } catch (e) { /* */ }

  // 3) Từ giờ: lưu key nào là ghi thẳng ra file trước, rồi mới vào localStorage.
  proto.setItem = function (k, v) {
    var key = String(k);
    if (this === ls && persisted(key)) { try { W.set(key, v == null ? '' : String(v)); } catch (e) { /* */ } }
    return _set.call(this, k, v);
  };
  proto.removeItem = function (k) {
    var key = String(k);
    if (this === ls && persisted(key)) { try { W.del(key); } catch (e) { /* */ } }
    return _del.call(this, k);
  };
})();
</script>
