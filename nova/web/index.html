<script>
(function () {
  var W = window.novaStore;
  if (!W || !W.seed || !window.localStorage) return;   // cháº¡y trÃªn web thÆ°á»ng: giá»¯ nguyÃªn hÃ nh vi cÅ©
  // Chá»‰ giá»¯ nhÃ³m Cáº¤U HÃŒNH/API. Dá»¯ liá»‡u náº·ng (hÃ ng Ä‘á»£i, lá»‹ch sá»­, projectâ€¦) váº«n náº±m yÃªn á»Ÿ localStorage.
  var PREFIX = ['api_', 'json_fb_', 't8_', 'skl_'];
  var EXACT = { 'yt_api_key': 1, 'pexels-key': 1, 'pixabay-key': 1, 'unsplash-key': 1 };
  function persisted(k) {
    if (EXACT[k]) return true;
    for (var i = 0; i < PREFIX.length; i++) if (k.indexOf(PREFIX[i]) === 0) return true;
    return false;
  }
  var ls = window.localStorage, proto = Storage.prototype;
  var _set = proto.setItem, _del = proto.removeItem;

  // 1) File â†’ localStorage. File lÃ  báº£n Gá»C: localStorage cÃ³ thá»ƒ vá»«a bá»‹ xoÃ¡ tráº¯ng hoáº·c lÃ  origin má»›i toanh.
  var seed = W.seed, seeded = {};
  for (var k in seed) {
    if (!Object.prototype.hasOwnProperty.call(seed, k)) continue;
    try { _set.call(ls, k, seed[k]); seeded[k] = 1; } catch (e) { /* Ä‘áº§y kho cÅ©ng ká»‡, file má»›i lÃ  chá»— dá»±a */ }
  }

  // 2) localStorage â†’ file: chuyá»ƒn nhÃ  má»™t láº§n cho key user Ä‘Ã£ nháº­p tá»« trÆ°á»›c báº£n vÃ¡ nÃ y.
  try {
    for (var i = 0; i < ls.length; i++) {
      var key = ls.key(i);
      if (key && !seeded[key] && persisted(key)) W.set(key, ls.getItem(key));
    }
  } catch (e) { /* */ }

  // 3) Tá»« giá»: lÆ°u key nÃ o lÃ  ghi tháº³ng ra file trÆ°á»›c, rá»“i má»›i vÃ o localStorage.
  proto.setItem = function (k, v) {
    var key = String(k);
    if (this === ls && persisted(key)) { try { W.set(key, v == null ? '' : String(v)); } catch (e) { /* */ } }
    return _set.call(this, k, v);
  };
  proto.removeItem = function (k) {
    var key = String(k);
    if (this === ls && persisted(key)) { try { W.del(key); } catch (e) { /* */ } }
    return _del.call(this, k);
  };
})();
</script>
