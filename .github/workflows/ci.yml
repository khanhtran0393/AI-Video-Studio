name: CI-Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Syntax Check
        run: npm run check:syntax

      - name: IPC Inventory Check
        run: npm run check:ipc

      - name: Parity Check
        run: npm run check:parity

      - name: Foundation Test
        run: npm run test:foundation

  build:
    name: Build & Artifact Generation
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build:win

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: AI-Video-Studio-Windows
          path: |
            dist/*.exe
            dist/*.yml
          retention-days: 7
